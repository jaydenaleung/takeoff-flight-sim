<!doctype html>
<html><head><meta charset="utf-8"><title>Hangar (dev)</title>
<style>html,body{margin:0;height:100%;background:#9fb4c8;overflow:hidden}canvas{display:block}</style></head>
<body>
<script type="module">
// Development viewer: /tools/hangar.html?id=b738&az=40&el=12&flap=1&gear=1
import * as THREE from 'three';
import { AIRCRAFT_BY_ID } from '../src/aircraft/specs.js';
import { AircraftModel } from '../src/aircraft/model.js';
const q = new URLSearchParams(location.search);
const spec = AIRCRAFT_BY_ID[q.get('id') || 'b738'];
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb4c8);
scene.add(new THREE.HemisphereLight(0xdfeaff, 0x556070, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 3.2);
sun.position.set(-60, 120, -40); sun.castShadow = true;
const R = spec.dims.span;
Object.assign(sun.shadow.camera, { left: -R, right: R, top: R, bottom: -R, near: 1, far: 400 });
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ color: 0x6f747a, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -spec.gear.cgH; ground.receiveShadow = true;
scene.add(ground);
const model = new AircraftModel(spec, { detail: 1 });
scene.add(model.group);
const st = { elev: +(q.get('elev') || 0), ail: +(q.get('ail') || 0), rud: +(q.get('rud') || 0), flap: +(q.get('flap') || 0), gear: +(q.get('gear') ?? 1), spoiler: +(q.get('spoiler') || 0), n1: 60, ab: +(q.get('ab') || 0), lights: { nav: true, beacon: true, strobe: true, landing: true }, camDist: 60 };
model.update(st, 0.016);
const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.5, 2000);
const az = (+(q.get('az') || 40)) * Math.PI / 180, el = (+(q.get('el') || 12)) * Math.PI / 180;
const dist = +(q.get('dist') || 0) || Math.max(spec.dims.length, spec.dims.span) * 1.75;
cam.position.set(Math.sin(az) * Math.cos(el) * dist, Math.sin(el) * dist, -Math.cos(az) * Math.cos(el) * dist);
cam.lookAt(0, spec.dims.height * 0.18 - spec.gear.cgH * 0.5, spec.dims.length * 0.05);
renderer.render(scene, cam);
window.__ready = true;
window.__dims = model.measure();
</script></body></html>
